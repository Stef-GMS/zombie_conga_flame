name: zombie_conga_flame
description: This is a Flutter version of the Zombie Conga app from the _2D Apple Games by Tutorials Ed 3.0_ book published by Kodeco, formerly raywenderlich.com.  It was created using Very Good Ventures[Flame game template](https://verygood.ventures/dev/tools) very_good create flame_game.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flame_behaviors: ^1.4.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.1
  intl: ^0.20.3
  window_manager: ^0.5.2

dev_dependencies:
  bloc_test: ^10.0.0
  flame_test: ^2.3.1
  flutter_test:
    sdk: flutter
  mockingjay: ^2.1.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/licenses/poppins/